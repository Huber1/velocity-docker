services:
  minecraft:
    image: docker.io/marctv/minecraft-papermc-server:latest
    restart: always
    container_name: "mc-proxy"
    environment:
      VELOCITY_FLAGS: ""
    volumes:
      - ./proxy:/data
    ports:
      - "25565:25565"
    # The following allow `docker attach minecraft` to work
    stdin_open: true
    tty: true
